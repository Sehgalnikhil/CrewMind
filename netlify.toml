[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API requests to the production backend
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-production-backend-url.com/api/:splat"
#   status = 200
#   force = true

# Proxy WebSockets
[[redirects]]
  from = "/ws/*"
  to = "wss://your-production-backend-url.com/ws/:splat"
  status = 200
  force = true

# React Router catch-all (Must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
