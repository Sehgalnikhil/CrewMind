[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://crewmind-bjlj.onrender.com/api"

# Proxy API requests to the production backend
[[redirects]]
  from = "/api/*"
  to = "https://crewmind-bjlj.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy WebSockets
[[redirects]]
  from = "/ws/*"
  to = "https://crewmind-bjlj.onrender.com/ws/:splat"
  status = 200
  force = true

# React Router catch-all (Must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
